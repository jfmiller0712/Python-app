<script type="text/python" id="runner">
# Bridge between the page and Brython: runs learner code and challenge tests.
from browser import window
import sys
import json

# Brython's json raises a plain Exception on bad input; CPython raises
# json.JSONDecodeError, a ValueError. Match CPython so lessons stay accurate.
class JSONDecodeError(ValueError):
    pass


def _strict(fn):
    def wrapper(*args, **kwargs):
        try:
            return fn(*args, **kwargs)
        except (ValueError, TypeError, RecursionError):
            raise
        except Exception as e:
            raise JSONDecodeError(str(e)) from None
    return wrapper


json.JSONDecodeError = JSONDecodeError
json.loads = _strict(json.loads)
json.load = _strict(json.load)


class _Sink:
    def __init__(self):
        self.parts = []

    def write(self, s):
        s = str(s)
        self.parts.append(s)
        return len(s)

    def flush(self):
        pass

    def text(self):
        return "".join(self.parts)


def _err_info(e):
    info = {"type": type(e).__name__, "message": str(e), "line": None}
    if isinstance(e, SyntaxError):
        info["line"] = e.lineno
        info["message"] = getattr(e, "msg", None) or str(e)
        return info
    tb = e.__traceback__
    while tb is not None:
        if tb.tb_frame.f_code.co_filename in ("<string>", "<learner>"):
            info["line"] = tb.tb_lineno
        tb = tb.tb_next
    return info


def run(code, stdin_json, tests_json):
    stdin = json.loads(stdin_json)
    tests = json.loads(tests_json)
    out = _Sink()

    def fake_input(prompt=""):
        out.write(str(prompt))
        if not stdin:
            raise EOFError("No more input available")
        value = stdin.pop(0)
        out.write(value + "\n")
        return value

    ns = {"__name__": "__main__", "input": fake_input}
    old_out, old_err = sys.stdout, sys.stderr
    sys.stdout = out
    sys.stderr = out
    error = None
    try:
        # exec() of a str keeps docstrings in Brython; compile() drops them.
        exec(code, ns)
    except SystemExit:
        pass
    except BaseException as e:
        error = _err_info(e)
    finally:
        sys.stdout, sys.stderr = old_out, old_err
    output = out.text()
    ns["__output__"] = output
    results = []
    for test in tests:
        sys.stdout = _Sink()
        try:
            exec(test, ns)
            results.append({"ok": True})
        except BaseException as e:
            detail = str(e)
            results.append({"ok": False, "error": type(e).__name__ + (": " + detail if detail else "")})
        finally:
            sys.stdout = old_out
    return json.dumps({"output": output, "error": error, "results": results})


window.pyRunJSON = run
window.__pyReady()
</script>
